<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="AntiFlock">
  <rect width="64" height="64" rx="10" fill="#0c0f16" />
  <!-- Vertical spinner disc with three impact teeth. -->
  <g transform="translate(32 32)">
    <circle r="19" fill="none" stroke="#8d939c" stroke-width="6" />
    <circle r="5.5" fill="#3f444a" />
    <g fill="#ff2b2b">
      <rect x="-3.5" y="-25" width="7" height="8" rx="1.5" />
      <rect x="-3.5" y="-25" width="7" height="8" rx="1.5" transform="rotate(120)" />
      <rect x="-3.5" y="-25" width="7" height="8" rx="1.5" transform="rotate(240)" />
    </g>
  </g>
</svg>
